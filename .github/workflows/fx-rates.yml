name: FX rates

on:
  schedule:
    - cron: '0 16 * * *'   # 매일 01:00 KST (UTC 16:00) — 전일 고시 환율 수집
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fx-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 수집 로직 테스트
        run: node --test calc/tests/fx-fetch.test.js

      - name: 환율 수집
        env:
          KOREAEXIM_AUTHKEY: ${{ secrets.KOREAEXIM_AUTHKEY }}
        run: node .github/scripts/fetch-fx.js

      - name: 변경 시 커밋
        run: |
          if git diff --quiet -- calc/data/fx/rates.json; then
            echo "변경 없음"
            exit 0
          fi
          BASE=$(node -p "require('./calc/data/fx/rates.json').base_date")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calc/data/fx/rates.json
          git commit -m "chore(fx): 환율 갱신 (기준일 ${BASE})"
          git push
