<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 투자 성향 찾기 | 돈버프</title>
<meta name="description" content="40개의 단어 중에서 고르고, 또 내려놓으며 투자할 때 나를 이끄는 성향을 만나는 5분짜리 테스트입니다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#3B2A1E; --muted:#8A6A55; --muted2:#B0A493;
    --amber:#B45309; --amberdk:#92400E;
    --brand-primary:#FF7A00;
    --bg1:#FBF0E6; --bg2:#FAF6F0; --bg3:#F2EBE0;
    --card:#FFFCF8; --line:#E8DDCF; --line2:#EFE4D6;
    --pick-bg:#FDECD2; --pick-line:#B45309; --pick-ink:#92400E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg2);}
  body{
    font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;
    color:var(--ink);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .serif{font-family:'Noto Serif KR','Nanum Myeongjo',Georgia,serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg2);position:relative;overflow-x:hidden;}
  .hidden{display:none !important;}

  /* 헤더 (인트로/결과에만 노출) */
  .app-header{
    display:flex;align-items:baseline;gap:6px;padding:11px 22px;
    background:rgba(255,252,248,0.6);border-bottom:1px solid rgba(232,221,207,0.7);
    text-decoration:none;
  }
  .app-header b{font-weight:700;font-size:14px;color:var(--brand-primary);}
  .app-header span{font-size:11px;color:#B8AFA4;}

  /* 진행 바 (1~5단계 공통) */
  .step-topbar{
    padding:12px 20px 12px;background:rgba(255,252,248,0.92);
    border-bottom:1px solid var(--line2);
    display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:20;
  }
  .step-back{width:28px;font-size:18px;color:var(--muted);cursor:pointer;user-select:none;}
  .step-back.invisible{visibility:hidden;}
  .step-progress{font-size:12.5px;color:#9A8878;}

  /* 인트로 */
  .intro-wrap{text-align:center;padding:46px 24px 52px;}
  .intro-icon{font-size:42px;line-height:1;}
  .intro-eyebrow{margin-top:22px;font-size:13px;letter-spacing:0.08em;font-weight:500;color:var(--amber);}
  .intro-title{margin-top:12px;font-size:29px;line-height:1.4;color:var(--ink);}
  .intro-body{margin-top:26px;font-size:15px;line-height:2;color:#6B4F3A;}
  .intro-body b{color:var(--amber);font-weight:500;}
  .intro-note{margin-top:18px;font-size:14px;line-height:1.85;color:var(--muted);}
  .intro-cards{display:flex;justify-content:center;gap:10px;margin-top:32px;}
  .intro-card{flex:1;max-width:96px;padding:14px 6px;background:var(--card);border:1px solid var(--line2);border-radius:16px;}
  .intro-card .num{font-family:'Noto Serif KR',Georgia,serif;font-size:24px;color:var(--amber);}
  .intro-card .lbl{margin-top:2px;font-size:11px;color:var(--muted);}
  .btn-primary{
    display:inline-block;padding:16px 42px;border-radius:999px;border:none;cursor:pointer;
    background:linear-gradient(135deg,var(--amber),var(--amberdk));color:#fff;
    font-family:inherit;font-size:16px;font-weight:500;
    box-shadow:0 10px 22px rgba(146,64,14,.25);
  }
  .btn-primary:disabled{background:#E6DED2;color:#A09282;box-shadow:none;cursor:not-allowed;}
  .btn-secondary{
    padding:14px 24px;border-radius:999px;border:1.5px solid #D9CDBB;background:var(--card);
    color:#5A4433;font-family:inherit;font-size:14px;cursor:pointer;
  }

  /* 단계 공통 */
  .step-scroll{padding:22px 20px 130px;}
  .step-eyebrow{font-size:12px;letter-spacing:0.08em;font-weight:600;color:var(--amber);}
  .step-heading{margin-top:9px;font-size:23px;line-height:1.45;color:var(--ink);}
  .step-sub{margin-top:10px;font-size:13.5px;line-height:1.7;color:var(--muted);}
  .counter-row{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px;}
  .counter-row .lbl{font-size:12.5px;color:var(--muted);}
  .counter-row .val{font-size:13px;color:var(--muted);}
  .counter-row .val b{color:var(--amber);font-size:15px;}
  .progress-bar{margin-top:7px;height:5px;border-radius:99px;background:var(--line2);overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,#D97706,var(--amber));transition:width .25s;}
  .hint-line{margin-top:20px;font-size:11.5px;color:var(--muted2);}

  .chip-wrap{display:flex;flex-wrap:wrap;gap:11px 9px;margin-top:16px;}
  .chip{
    font-family:inherit;font-size:14.5px;line-height:1.2;padding:11px 17px;min-height:44px;
    display:inline-flex;align-items:center;border-radius:999px;border:1.5px solid #D9CDBB;
    background:var(--card);color:#5A4433;cursor:pointer;white-space:nowrap;
    transition:background .2s,border-color .2s,color .2s,opacity .2s,transform .2s;
  }
  .chip:hover{border-color:#C9B89F;}
  .chip[aria-pressed="true"]{background:var(--pick-bg);border-color:var(--pick-line);color:var(--pick-ink);font-weight:500;transform:scale(1.03);}
  .chip[aria-pressed="true"]::before{content:"✓ ";}
  .chip.dropped{background:#F4EFE7;border-color:#E3D9C9;color:#B7A78F;opacity:.42;transform:scale(.96);}
  .chip.fadeout{opacity:0;transform:scale(.85);pointer-events:none;}
  @media (prefers-reduced-motion: reduce){.chip{transition:none;}}

  .bottom-cta{position:absolute;left:0;right:0;bottom:0;padding:20px;background:linear-gradient(to top,var(--bg2) 72%,rgba(250,246,240,0));}
  .cta-btn{width:100%;font-family:inherit;font-size:15.5px;font-weight:500;padding:16px;border-radius:999px;border:none;transition:background .2s,box-shadow .2s;cursor:pointer;}
  .cta-btn:disabled{background:#E6DED2;color:#A09282;cursor:not-allowed;}
  .cta-btn.on{background:linear-gradient(135deg,var(--amber),var(--amberdk));color:#fff;box-shadow:0 10px 22px rgba(146,64,14,.25);}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;
    padding:9px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap;z-index:300;max-width:88%;text-align:center;}
  .toast.show{opacity:1;}

  .full-overlay{position:absolute;inset:0;background:var(--bg2);display:flex;align-items:center;justify-content:center;
    padding:40px;text-align:center;opacity:1;transition:opacity .4s;z-index:30;}
  .full-overlay.hide{opacity:0;pointer-events:none;}

  .bridge-dots{display:flex;gap:6px;justify-content:center;margin-top:30px;}
  .bridge-dots span{width:7px;height:7px;border-radius:50%;background:var(--amber);animation:bdot 1.1s ease-in-out infinite;}
  .bridge-dots span:nth-child(2){animation-delay:.15s;}
  .bridge-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bdot{0%,80%,100%{transform:scale(.6);opacity:.35;}40%{transform:scale(1);opacity:1;}}
  @media (prefers-reduced-motion: reduce){.bridge-dots span{animation:none;opacity:.7;}}

  .rword{display:inline-block;padding:12px 20px;margin:4px;border-radius:16px;background:var(--pick-bg);
    border:1px solid #EFCFA0;color:var(--amberdk);font-size:16px;font-weight:500;font-family:'Noto Serif KR',Georgia,serif;}
  .rword-lg{padding:14px 22px;border-radius:16px;background:var(--amber);color:#fff;font-size:17px;font-weight:600;
    font-family:'Noto Serif KR',Georgia,serif;box-shadow:0 8px 18px rgba(180,83,9,.28);}

  /* 4단계 카드 */
  .scn-card{border:1.5px solid #D9CDBB;background:var(--card);border-radius:18px;padding:20px;font-size:15px;line-height:1.55;
    color:var(--ink);cursor:pointer;transition:background .25s,border-color .25s,transform .2s,opacity .3s;}
  .scn-card:hover{border-color:#C9B89F;}
  .scn-card.picked{background:var(--pick-bg);border-color:var(--pick-line);transform:scale(1.015);}
  .scn-card.faded{opacity:.25;}
  .scn-divider{display:flex;align-items:center;gap:10px;padding:12px 0;}
  .scn-divider .ln{flex:1;height:1px;background:#E3D6C2;}
  .scn-divider span{font-size:11.5px;color:var(--muted2);white-space:nowrap;}

  /* 5단계 리스트 옵션 */
  .opt-item{width:100%;text-align:left;border:1.5px solid #D9CDBB;background:var(--card);border-radius:14px;
    padding:15px 16px;min-height:48px;font-size:14.5px;line-height:1.5;color:var(--ink);cursor:pointer;
    transition:background .25s,border-color .25s,transform .2s,opacity .3s;display:flex;align-items:center;gap:10px;}
  .opt-item:hover{border-color:#C9B89F;}
  .opt-item .num{flex-shrink:0;width:24px;height:24px;border-radius:50%;border:1.5px solid #D9CDBB;display:flex;
    align-items:center;justify-content:center;font-size:12px;color:var(--muted);}
  .opt-item.picked{background:var(--pick-bg);border-color:var(--pick-line);transform:scale(1.01);}
  .opt-item.picked .num{background:var(--amber);border-color:var(--amber);color:#fff;}
  .opt-item.faded{opacity:.3;}

  /* 결과 화면 */
  .res-sec{padding:30px 22px;border-bottom:1px solid var(--line2);}
  .res-sec:last-child{border-bottom:none;}
  .res-hero{text-align:center;padding-top:38px;}
  .res-code{font-size:13px;color:var(--muted2);letter-spacing:0.15em;}
  .res-name{margin-top:8px;font-size:30px;color:var(--ink);}
  .res-catch{margin-top:14px;font-size:15.5px;line-height:1.7;color:var(--amberdk);}
  .res-illust{margin-top:22px;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;}
  .res-illust img{width:100%;height:100%;object-fit:cover;display:block;}
  .res-desc{margin-top:20px;font-size:13.5px;line-height:1.8;color:#6B4F3A;max-width:300px;margin-left:auto;margin-right:auto;}

  .axis-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px;}
  .axis-card{background:var(--card);border:1px solid var(--line2);border-radius:14px;padding:14px;}
  .axis-badge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    background:var(--amber);color:#fff;font-size:12px;font-weight:700;margin-right:8px;}
  .axis-name{font-size:13.5px;color:var(--ink);font-weight:700;}
  .axis-desc{margin-top:8px;font-size:12px;line-height:1.5;color:var(--muted);}
  .axis-note{margin-top:6px;font-size:10.5px;color:#C2620A;}

  .words-wrap{margin-top:14px;text-align:center;}
  .word-chip{display:inline-block;padding:10px 16px;border-radius:999px;background:var(--pick-bg);
    border:1px solid #EFCFA0;color:var(--amberdk);font-size:14px;font-family:'Noto Serif KR',Georgia,serif;margin:4px;}

  .temp-block{text-align:center;}
  .temp-emoji{font-size:30px;margin-top:6px;}
  .temp-val{font-family:'Noto Serif KR',Georgia,serif;font-size:20px;color:var(--amber);margin-top:4px;}
  .temp-desc{margin-top:10px;font-size:13px;line-height:1.7;color:var(--muted);max-width:270px;margin-left:auto;margin-right:auto;}

  #promptBox{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  #promptBox.open{max-height:1200px;}
  .prompt-text{font-size:11.5px;line-height:1.7;color:#6B4F3A;white-space:pre-wrap;background:#FBF6EE;
    border:1px solid var(--line2);border-radius:10px;padding:14px;margin-top:12px;max-height:320px;overflow-y:auto;}
  .copy-btn{width:100%;padding:13px;border-radius:12px;border:1.5px solid #D9CDBB;background:var(--card);
    color:#5A4433;font-size:13.5px;font-family:inherit;cursor:pointer;margin-top:10px;}
  .copy-btn.done{border-color:var(--amber);color:var(--amberdk);background:var(--pick-bg);}
  .ai-tool-tag{display:inline-block;font-size:11.5px;color:var(--muted2);padding:5px 10px;border:1px solid #EAE0D2;
    border-radius:999px;margin-right:6px;margin-top:8px;}

  .share-row{display:flex;gap:10px;}
  .share-btn{flex:1;padding:14px;border-radius:999px;font-size:14px;font-family:inherit;cursor:pointer;}
  .disclaimer{margin-top:22px;font-size:10.5px;line-height:1.7;color:var(--muted2);text-align:center;}

  /* 공유 시트 */
  #shareOverlay{position:fixed;inset:0;background:rgba(59,42,30,0.45);display:none;align-items:flex-end;justify-content:center;z-index:200;}
  #shareOverlay.open{display:flex;}
  #shareSheet{width:100%;max-width:480px;background:var(--bg2);border-radius:22px 22px 0 0;
    padding:16px 22px calc(22px + env(safe-area-inset-bottom,0px));
    max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);
    overflow-y:auto;-webkit-overflow-scrolling:touch;
    animation:sheetUp .25s ease;}
  @keyframes sheetUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
  .sheet-handle{width:40px;height:4px;border-radius:99px;background:#E6D9C3;margin:0 auto 16px;cursor:pointer;}
  .share-preview{height:min(48dvh,460px);height:min(48vh,460px);display:flex;align-items:center;justify-content:center;}
  @media (max-height:700px){ .share-preview{height:40dvh;height:40vh;} }
  .share-preview img{height:100%;width:auto;max-width:100%;object-fit:contain;border-radius:14px;
    box-shadow:0 6px 18px rgba(0,0,0,.12);display:block;margin:0 auto;}

  .share-cta-banner{text-align:center;margin-top:20px;}
  .share-cta-banner .headline{font-size:14.5px;font-weight:700;color:var(--ink);}
  .share-cta-banner .sub{margin-top:4px;font-size:12px;color:var(--muted);}

  .btn-ghost-sm{padding:12px;border-radius:12px;border:1.5px solid #D9CDBB;background:transparent;
    color:#5A4433;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;}
  .share-channels{display:flex;justify-content:space-around;margin-top:16px;}
  .ch-btn{display:flex;flex-direction:column;align-items:center;gap:7px;background:none;border:none;
    font-family:inherit;cursor:pointer;padding:4px;}
  .ch-ico-img{width:58px;height:58px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.1));}
  .ch-label{font-size:11.5px;color:var(--muted);font-weight:600;}
  .share-divider{height:1px;background:#EDE2D0;margin:20px 0 16px;}
  .share-card-preview{background:linear-gradient(165deg,var(--bg1) 0%,var(--bg2) 42%,var(--bg3) 100%);
    border:1px solid #EFE1CB;border-radius:16px;padding:20px 16px;text-align:center;max-height:100%;overflow-y:auto;}

  /* 이어하기 안내 */
  #resumeOverlay{position:fixed;inset:0;background:rgba(59,42,30,0.5);display:none;align-items:center;justify-content:center;z-index:210;padding:24px;}
  #resumeOverlay.open{display:flex;}
  #resumeCard{max-width:340px;width:100%;background:var(--bg2);border-radius:18px;padding:28px 24px;text-align:center;}

  a{color:inherit;}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GW588P483F"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-GW588P483F');
</script>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status"></div>

<div id="resumeOverlay">
  <div id="resumeCard">
    <div class="serif" style="font-size:18px;color:var(--ink);">이어서 진행할까요?</div>
    <div style="margin-top:10px;font-size:13px;line-height:1.7;color:var(--muted);">하던 곳에서 이어가시거나,<br>처음부터 다시 시작할 수 있어요.</div>
    <div style="margin-top:20px;display:flex;flex-direction:column;gap:10px;">
      <button id="resumeContinueBtn" class="cta-btn on" style="width:100%;">이어하기</button>
      <button id="resumeRestartBtn" class="btn-secondary" style="width:100%;">처음부터</button>
    </div>
  </div>
</div>

<div id="shareOverlay">
  <div id="shareSheet"></div>
</div>

<script>
/* =========================================================
   1. DATA
========================================================= */
const CURRENT_VERSION = "1.0";

const AXES = ["decision","information","judgment","operation"];
const AXIS_POLES = {
  decision:["C","O"], information:["S","N"], judgment:["T","F"], operation:["L","Q"]
};
const AXIS_LABELS = {
  C:{name:"참고형", en:"Consult", desc:"여러 의견과 정보를 폭넓게 모아서",
    descLong:"여러 의견과 정보를 폭넓게 모아서, 남의 경험과 시선을 참고해 판단해요"},
  O:{name:"독립형", en:"Own", desc:"정보를 참고하되 결론은 내 판단으로",
    descLong:"정보는 참고하되, 최종 결론은 직접 확인하고 내 판단으로 내려요"},
  S:{name:"감각형", en:"Sensing", desc:"현재 확인되는 사실과 숫자를 먼저",
    descLong:"실적, 재무제표처럼 지금 확인되는 사실과 숫자를 먼저 살펴봐요"},
  N:{name:"직관형", en:"iNtuition", desc:"앞으로의 흐름과 가능성을 먼저",
    descLong:"산업의 흐름과 트렌드, 앞으로 펼쳐질 가능성을 먼저 그려봐요"},
  T:{name:"분석형", en:"Thinking", desc:"원칙과 기준을 세워 판단",
    descLong:"미리 정해둔 원칙과 기준에 맞는지 따져보고 판단해요"},
  F:{name:"감성형", en:"Feeling", desc:"마음이 가는 신뢰와 애정으로 판단",
    descLong:"숫자보다 마음이 가는 신뢰와 애정, 끌림을 기준으로 판단해요"},
  L:{name:"장기계획형", en:"Long-term", desc:"정해둔 계획과 루틴으로 오래",
    descLong:"한번 세운 계획과 루틴을 지키며, 시간을 두고 오래 지켜봐요"},
  Q:{name:"단기대응형", en:"Quick response", desc:"상황 변화에 맞춰 기민하게",
    descLong:"상황이 달라지면 망설이지 않고 빠르게 판단을 바꿔요"}
};

// 40 키워드 = 8극 x 5
const KEYWORDS_RAW = {
  C:["전문가 의견","다양한 관점","집단지성","멘토","리포트"],
  O:["소신","직접 공부","내 판단","나만의 시각","자기 주도"],
  S:["현재 실적","재무제표","현금흐름","실제 수치","팩트"],
  N:["미래 성장","산업 트렌드","혁신","새로운 시장","가능성"],
  T:["원칙","정해둔 기준","체크리스트","매수 조건","손절선"],
  F:["기업 신뢰","가치 공감","브랜드 호감","마음의 끌림","애정"],
  L:["복리","꾸준한 적립","긴 호흡","정기 점검","루틴"],
  Q:["타이밍","발 빠른 대처","유연함","민첩함","수시 점검"]
};
let _kwId = 0;
const KEYWORDS = [];
Object.keys(KEYWORDS_RAW).forEach(pole=>{
  const axis = AXES.find(a=>AXIS_POLES[a].includes(pole));
  KEYWORDS_RAW[pole].forEach(text=>{
    KEYWORDS.push({ id:"k"+(_kwId++), text, pole, axis });
  });
});
const KW_BY_ID = {}; KEYWORDS.forEach(k=>KW_BY_ID[k.id]=k);

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* =========================================================
   4. 판정 엔진 — 입력(session)만으로 결과를 반환하는 순수 함수
========================================================= */
function calculateResult(session){
  // 4.1 극별 점수 계산
  const score = {}; Object.keys(AXIS_LABELS).forEach(p=>score[p]=0);

  session.step1_selected.forEach(id=>{ score[KW_BY_ID[id].pole] += 1; });                 // 선택 +1
  const survivors8 = session.step1_selected.filter(id=>!session.step2_dropped.includes(id));
  survivors8.forEach(id=>{ score[KW_BY_ID[id].pole] += 2; });                              // 8개 생존 +2
  session.step3_kept.forEach(id=>{ score[KW_BY_ID[id].pole] += 3; });                      // 최종 4개 +3
  AXES.forEach((axis,i)=>{
    const ans = session.step4_answers[i];
    if(ans) score[ans] += 4;                                                               // 갈림길 +4
  });

  // 4.2 축별 근거 개수 (1단계에서 해당 극을 고른 횟수)
  function evidenceCount(pole){
    return session.step1_selected.filter(id=>KW_BY_ID[id].pole===pole).length;
  }

  // 4.3 축별 판정
  const axis_result = {};
  const axis_scores_detail = {};
  const typeCodeParts = [];
  AXES.forEach((axis,i)=>{
    const [p1,p2] = AXIS_POLES[axis];
    const A = score[p1], B = score[p2];
    let winner;
    if(A===B){
      // 동점 → 그 축 갈림길에서 고른 극 (항상 강제 응답이라 반드시 존재)
      winner = session.step4_answers[i];
    } else {
      winner = A>B ? p1 : p2;
    }
    const diff = Math.abs(A-B), sum = A+B;
    const raw = sum ? diff/sum : 0;
    const evid = evidenceCount(winner);
    // 강도 라벨 구간값: 베타 후 확정 예정 (임시값)
    let strength_label;
    if(evid<=1) strength_label = "경계";
    else if(raw>=0.5) strength_label = "뚜렷함";
    else strength_label = "보통";

    axis_result[axis] = winner;
    axis_scores_detail[axis] = { A:{pole:p1,score:A}, B:{pole:p2,score:B}, strength_raw:raw, evidence_count:evid, strength_label };
    typeCodeParts.push(winner);
  });
  const type_code = typeCodeParts.join("");

  // 4.4 notable_dropped: 1단계에서 골랐지만 최종4개엔 없고, 그 축의 승자 극과 반대인 단어
  const core4Ids = session.step3_kept;
  const candidates = session.step1_selected.filter(id=>!core4Ids.includes(id)).map(id=>{
    const kw = KW_BY_ID[id];
    const winnerPole = axis_result[kw.axis];
    const opposes = (winnerPole !== kw.pole); // 승자와 다른 극이면 "대조적"
    const survived_until = survivors8.includes(id) ? "top8" : "top16";
    return { id, word:kw.text, pole:kw.pole, axis:kw.axis, opposes, survived_until };
  }).filter(c=>c.opposes);
  candidates.sort((a,b)=>{
    const rank = v=> v.survived_until==="top8" ? 1 : 0;
    return rank(b)-rank(a);
  });
  const notable_dropped = candidates.slice(0,2).map(c=>({
    word: c.word,
    opposes: AXIS_LABELS[axis_result[c.axis]].name,
    survived_until: c.survived_until
  }));

  // 4.5 위험 온도 (유형과 완전 분리)
  const riskSum = session.step5_answers.reduce((a,b)=>a+(b||0),0);
  let risk_temperature;
  if(riskSum<=-2) risk_temperature = "신중";
  else if(riskSum>=2) risk_temperature = "과감";
  else risk_temperature = "균형";

  // 4.6 선택 문장 그대로 (프롬프트용)
  const scenario_answers = SCENARIOS.map((s,i)=>{
    const pole = session.step4_answers[i];
    const choice = (s.A.pole===pole) ? s.A.text : s.B.text;
    return { situation: s.situation.replace(/\n/g," "), choice };
  });

  const core_keywords = session.step3_kept.map(id=>KW_BY_ID[id].text);
  const typeInfo = TYPES[type_code] || { name:"("+type_code+")", catch:"", desc:"", emoji:"✨" };

  return {
    type_code,
    type_name: typeInfo.name,
    type_catchline: typeInfo.catch,
    type_desc: typeInfo.desc,
    type_emoji: typeInfo.emoji,
    axis_result,                 // {decision:'O', information:'S', ...}
    axis_scores_detail,          // 내부용 원점수 (raw/label 분리)
    core_keywords,                // 최종 4개 단어 텍스트
    notable_dropped,
    scenario_answers,
    risk_temperature,
    risk_sum: riskSum,
    computed_at: Date.now(),
    scoring_version: "1.0"
  };
}

  if(!SESSION.scenario_card_order){
    SESSION.scenario_card_order = SCENARIOS.map(()=>Math.random()<0.5);

  }
  const swap = SESSION.scenario_card_order;
  let idx = SESSION.step4_answers.findIndex(a=>a===null);
  if(idx===-1) idx = 3; // 전부 응답됨(뒤로가기로 돌아온 경우) → 마지막 문항부터 보여줌

  $app.innerHTML = `
    ${topBar(4,null,true)}
    <div class="full-overlay" id="s4entry">
      <div style="width:100%;">
        <div style="font-size:12px;letter-spacing:0.08em;color:var(--amber);font-weight:600;">투자의 갈림길</div>
        <div class="serif" style="margin-top:16px;font-size:22px;line-height:1.6;color:var(--ink);">단어 속의 나는 여기까지.<br>실제 투자 순간의<br>나는 어떨까요?</div>
        <div style="margin-top:18px;font-size:13px;line-height:1.7;color:var(--muted);">네 번의 갈림길이 기다리고 있어요.<br>정답보다 평소의 나와<br>더 가까운 쪽을 골라주세요.</div>
        <button class="btn-primary" id="s4entryNext" style="margin-top:28px;">다음 여정으로 &nbsp;→</button>
      </div>
    </div>
    <div class="full-overlay hide" id="s4bridge">
      <div style="width:100%;">
        <div class="serif" style="font-size:19px;line-height:1.7;color:var(--ink);">네 번의 선택이<br>끝났습니다</div>
        <div style="margin-top:14px;font-size:13.5px;line-height:1.7;color:var(--muted);">이제 마지막으로<br>나의 투자 온도를<br>확인해볼게요</div>
      </div>
    </div>
    <div class="step-scroll" id="s4wrap" style="opacity:0;display:none;transition:opacity .25s;min-height:400px;">
      <div class="step-eyebrow">갈림길 <span id="s4no"></span> · <span id="s4frac"></span></div>
      <div class="step-heading serif" id="s4text" style="font-size:19px;"></div>
      <div style="margin-top:24px;" id="s4cardA" class="scn-card"></div>
      <div class="scn-divider"><span class="ln"></span><span>또는</span><span class="ln"></span></div>
      <div id="s4cardB" class="scn-card"></div>
    </div>`;

  const wrap=document.getElementById("s4wrap"), qno=document.getElementById("s4no"), qfrac=document.getElementById("s4frac"),
        qtext=document.getElementById("s4text"), cardA=document.getElementById("s4cardA"), cardB=document.getElementById("s4cardB");

  function renderQ(i){
    idx=i;
    const s = SCENARIOS[i];
    qno.textContent = String(i+1).padStart(2,"0");
    qfrac.textContent = (i+1)+" / 4";
    qtext.innerHTML = s.situation.replace(/\n/g,"<br>");
    const top = swap[i] ? s.B : s.A;
    const bot = swap[i] ? s.A : s.B;
    cardA.textContent = top.text; cardA.dataset.pole = top.pole;
    cardB.textContent = bot.text; cardB.dataset.pole = bot.pole;
    cardA.className="scn-card"; cardB.className="scn-card";
    const ans = SESSION.step4_answers[i];
    if(ans===top.pole) cardA.classList.add("picked");
    if(ans===bot.pole) cardB.classList.add("picked");
  }

  function pick(el, otherEl, pole){
    SESSION.step4_answers[idx] = pole;
    saveSession();
    el.classList.add("picked");
    setTimeout(()=>{
      otherEl.classList.add("faded");
      setTimeout(()=>{
        if(idx<3){
          wrap.style.opacity="0";
          setTimeout(()=>{ renderQ(idx+1); wrap.style.opacity="1"; }, 220);
        } else {
          setTimeout(()=>{
            const bridge=document.getElementById("s4bridge");
            bridge.classList.remove("hide");
            setTimeout(()=>{
              bridge.classList.add("hide");
              setTimeout(()=>{
                SESSION.current_step=5; saveSession();
                renderStep5();
              }, 400);
            }, 3000);
          }, 350);
        }
      }, 300);
    }, 60);
  }
  cardA.addEventListener("click", ()=>{ if(cardA.classList.contains("picked")) return; pick(cardA,cardB,cardA.dataset.pole); });
  cardB.addEventListener("click", ()=>{ if(cardB.classList.contains("picked")) return; pick(cardB,cardA,cardB.dataset.pole); });

  renderQ(idx);
  document.getElementById("s4entryNext").addEventListener("click", ()=>{
    document.getElementById("s4entry").classList.add("hide");
    wrap.style.display="block";
    raf(()=>{ wrap.style.opacity="1"; });
  });

  bindBack(()=>{
    if(idx>0){
      wrap.style.opacity="0";
      setTimeout(()=>{ renderQ(idx-1); wrap.style.opacity="1"; }, 200);
      return true; // custom back handled, don't navigate to step3
    }
    return false;
  });
}

      <div id="s5opts" style="display:flex;flex-direction:column;gap:10px;margin-top:22px;"></div>
    </div>`;

  const wrap=document.getElementById("s5wrap"), lbl=document.getElementById("s5lbl"),
        qtext=document.getElementById("s5text"), opts=document.getElementById("s5opts");

  function renderQ(i){
    idx=i;
    const q = RISK_QUESTIONS[i];
    lbl.textContent=q.label;

    opts.innerHTML="";
    q.options.forEach((op,oi)=>{
      const b=document.createElement("button");
      b.className="opt-item";
      b.innerHTML = `<span class="num">${oi+1}</span><span>${op.text}</span>`;

    wrap.style.display="none";

      <div style="width:100%;">
        <div id="s5bLine1" style="font-size:14px;color:var(--muted);opacity:0;transition:opacity .5s;">당신의 선택을 모으고 있어요</div>
        <div id="s5bWords" style="margin-top:18px;max-width:280px;margin-left:auto;margin-right:auto;min-height:40px;"></div>
        <div id="s5bLine2" style="margin-top:4px;font-size:14px;color:var(--muted);opacity:0;transition:opacity .5s;">선택의 흐름을 연결하는 중…</div>
        <div id="s5bFinal" style="margin-top:4px;font-size:18px;color:var(--ink);opacity:0;transition:opacity .5s;" class="serif">투자 성향을 찾았어요.</div>
        <div class="bridge-dots"><span></span><span></span><span></span></div>
      </div>`;
    const line1=document.getElementById("s5bLine1"),
          line2=document.getElementById("s5bLine2"),
          final=document.getElementById("s5bFinal"),
          bw=document.getElementById("s5bWords");

    // 0~2초: 첫 문구 페이드인 → 페이드아웃
    raf(()=>{ line1.style.opacity="1"; });
    setTimeout(()=>{ line1.style.opacity="0"; }, 1400);

    // 2~4초: 끝까지 남긴 4단어가 하나씩 등장
    kept.forEach((id,i)=>{
      const s=document.createElement("span");
      s.textContent = KW_BY_ID[id].text;
      s.style.cssText="display:inline-block;padding:9px 16px;margin:4px;border-radius:12px;background:var(--pick-bg);border:1px solid #EFCFA0;color:var(--amberdk);font-size:14px;font-family:'Noto Serif KR',Georgia,serif;opacity:0;transform:translateY(6px);transition:opacity .4s,transform .4s;";
      bw.appendChild(s);
      setTimeout(()=>{ s.style.opacity="1"; s.style.transform="translateY(0)"; }, 2000+i*400);
    });

    // 4~6초: 두번째 문구 페이드인 → 페이드아웃
    setTimeout(()=>{ line2.style.opacity="1"; }, 4000);
    setTimeout(()=>{ line2.style.opacity="0"; }, 5400);

    // 6~8초: 마지막 문구 페이드인 → 페이드아웃
    setTimeout(()=>{ final.style.opacity="1"; }, 6000);
    setTimeout(()=>{ final.style.opacity="0"; }, 7400);

    // 8초: 결과 화면 전환
    setTimeout(()=>{
      SESSION.result = calculateResult(SESSION);
      SESSION.current_step = "result";
      saveSession();
      if(typeof gtag === "function") gtag("event", "test_complete", { result_type: SESSION.result.type_code });
      renderResult();
    }, 8000);
  }

  renderQ(idx);
  document.getElementById("s5entryNext").addEventListener("click", ()=>{
    document.getElementById("s5entry").classList.add("hide");
    wrap.style.display="block";
    raf(()=>{ wrap.style.opacity="1"; });
  });

  bindBack(()=>{
    if(idx>0){
      wrap.style.opacity="0";
      setTimeout(()=>{ renderQ(idx-1); wrap.style.opacity="1"; }, 200);
      return true;
    }
    return false;
  });
}

function bindBack(customHandler){
  const btn = document.getElementById("stepBackBtn");
  if(!btn) return;
  btn.addEventListener("click", ()=>{
    if(customHandler && customHandler()===true) return;
    const step = SESSION.current_step;
    if(step===2){ SESSION.current_step=1; saveSession(); renderStep1(); }
    else if(step===3){ SESSION.current_step=2; saveSession(); renderStep2(); }
    else if(step===4){ SESSION.current_step=3; saveSession(); renderStep3(); }
    else if(step===5){ SESSION.current_step=4; saveSession(); renderStep4(); }
  });
}

function buildPrompt(result){

--- MY DATA ---
${dataStr}

위 데이터를 바탕으로 아래 6가지를 분석해주세요.
type.catchline과 비슷한 톤(짧고 은유적인 한 문장 + 이어지는
2~3문장의 장면 묘사)으로, 이 사람이 읽었을 때 자신의

function copyText(str){
  if(navigator.clipboard && navigator.clipboard.writeText){
    return navigator.clipboard.writeText(str).then(()=>true).catch(()=>false);
  }
  return Promise.resolve(false);
}

  overlay.classList.add("open");

  document.getElementById("shHandle").addEventListener("click", ()=>overlay.classList.remove("open"));
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) overlay.classList.remove("open"); });

  document.getElementById("shCopy").addEventListener("click", ()=>{
    if(typeof gtag === "function") gtag("event", "link_share", { channel: "copy_button", result_type: r.type_code });
    copyText(shareUrl).then(ok=> toast(ok ? "링크가 복사되었어요" : "복사에 실패했어요"));
  });

  // 이미지 다운로드 (이미지 저장 버튼 + 인스타 폴백에서 공통 사용)
  function saveShareImage(){
    const asset = hasShareCard(r.type_code) ? assetPath(r.type_code,'shareCard') : null;
    if(asset){
      const a=document.createElement("a");
      a.href=asset; a.download="donbuff-invest-mbti-"+r.type_code+".jpg";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      return;
    }
    drawShareCanvas(r, function(blob){
      const url = URL.createObjectURL(blob);
      const a=document.createElement("a");
      a.href=url; a.download="invest-type-"+r.type_code+".png";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url), 1000);
    });
  }

  const shareText = "나는 "+r.type_name+" "+r.type_emoji+"! 당신은 어떤 투자자일까요?";

  // 카카오톡 — 유형별 OG 랜딩 URL 공유 (SDK 키가 없어 OS 공유창을 거치지만,
  // 유형별 링크라 준비된 유형은 카카오톡에서 이미지 포함 리치 카드로 보임)
  document.getElementById("chKakao").addEventListener("click", async ()=>{
    if(typeof gtag === "function") gtag("event", "link_share", { channel: "kakao", result_type: r.type_code });
    const landingUrl = shareLandingUrl(r.type_code);
    if(navigator.share){
      try{
        await navigator.share({ title:"나의 투자 성향 찾기", text:shareText, url:landingUrl });
        return;
      }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }
    const ok = await copyText(landingUrl);
    toast(ok ? "공유 링크를 복사했어요" : "복사에 실패했어요");
  });

  // Instagram — 이미지 중심 공유 전용 (url/text를 함께 보내려 하지 않음)
  document.getElementById("chInsta").addEventListener("click", async ()=>{
    if(typeof gtag === "function") gtag("event", "link_share", { channel: "instagram", result_type: r.type_code });
    if(navigator.share && navigator.canShare){
      try{
        const file = await buildShareFile();
        if(file && navigator.canShare({ files:[file] })){
          try{
            await navigator.share({ files:[file] });
            return;
          }catch(err){
            if(err && err.name === "AbortError") return;
          }
        }
      }catch(e){ /* 파일 생성 실패 -> 저장 폴백 */ }
    }
    saveShareImage();
    toast("이미지를 저장했어요. Instagram에서 스토리에 추가해보세요.");
  });

  // 기타 공유 — 범용 텍스트 + URL
  document.getElementById("chEtc").addEventListener("click", async ()=>{
    if(typeof gtag === "function") gtag("event", "link_share", { channel: "other", result_type: r.type_code });
    if(navigator.share){
      try{
        await navigator.share({ title:"나의 투자 성향 찾기", text:shareText, url:shareUrl });
        return;
      }catch(err){
        if(err && err.name === "AbortError") return;
      }
    }
    const ok = await copyText(shareUrl);
    toast(ok ? "공유 링크를 복사했어요" : "복사에 실패했어요");
  });

  // 공유용 이미지를 Blob/File로 만드는 공통 헬퍼 (Instagram 버튼에서 사용)
  // - 실제 유형별 공유카드가 준비된 경우: fetch로 가져와 File 변환
  // - 없는 경우: 기존 drawShareCanvas(캔버스 텍스트 카드)를 재사용
  function buildShareFile(){
    return new Promise((resolve)=>{
      const asset = hasShareCard(r.type_code) ? assetPath(r.type_code,'shareCard') : null;
      if(asset){
        fetch(asset).then(res=>{
          if(!res.ok) throw new Error("fetch failed");
          return res.blob();
        }).then(blob=>{
          resolve(new File([blob], "donbuff-invest-mbti-"+r.type_code+".jpg", {type: blob.type || "image/jpeg"}));
        }).catch(()=> resolve(null));
      } else {
        drawShareCanvas(r, function(blob){
          if(!blob){ resolve(null); return; }
          resolve(new File([blob], "invest-type-"+r.type_code+".png", {type:"image/png"}));
        });
      }
    });
  }

  document.getElementById("shSave").addEventListener("click", ()=>{
    if(typeof gtag === "function") gtag("event", "image_save", { result_type: r.type_code });
    saveShareImage();
    toast("이미지가 저장되었어요");
  });
}

function drawShareCanvas(r, cb){
  const W=640, H=800;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,"#FBF0E6"); grad.addColorStop(0.5,"#FAF6F0"); grad.addColorStop(1,"#F2EBE0");
  ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#EFE1CB"; ctx.lineWidth=3; ctx.strokeRect(20,20,W-40,H-40);

  ctx.textAlign="center";
  ctx.fillStyle="#B45309"; ctx.font="600 22px sans-serif";
  ctx.fillText("나는 어떤 투자자일까?", W/2, 130);

  ctx.fillStyle="#3B2A1E"; ctx.font="700 50px serif";
  ctx.fillText(r.type_name, W/2, 230);

  ctx.fillStyle="#92400E"; ctx.font="400 24px serif";
  const catchLines = r.type_catchline.split(", ");
  ctx.fillText(catchLines[0]+(catchLines[1]?",":""), W/2, 288);
  if(catchLines[1]) ctx.fillText(catchLines[1], W/2, 322);

  ctx.fillStyle="#8A6A55"; ctx.font="400 18px sans-serif";
  const axisLine = ["decision","information","judgment","operation"].map(a=>AXIS_LABELS[r.axis_result[a]].name).join(" · ");
  ctx.fillText(axisLine, W/2, 400);

  // 핵심 키워드 4개
  ctx.font="400 17px serif";
  const kwLine = r.core_keywords.join("  ·  ");
  ctx.fillStyle="#B45309";
  ctx.fillText(kwLine, W/2, 460);

  ctx.fillStyle="#3B2A1E"; ctx.font="500 24px sans-serif";
  ctx.fillText("나는 "+r.type_name+" "+r.type_emoji, W/2, 600);
  ctx.font="500 22px sans-serif";
  ctx.fillText("당신은 어떤 투자자일까요?", W/2, 636);

  ctx.fillStyle="#B0A493"; ctx.font="400 18px sans-serif";
  ctx.fillText("donbuff.com/invest-mbti", W/2, 690);

  c.toBlob(function(blob){ cb(blob); }, "image/png");
}

/* =========================================================
   16. 부팅
========================================================= */
function boot(){
  const saved = loadSession();
  if(saved && saved.result){
    SESSION = saved;
    renderResult();
    return;
  }
  if(saved && saved.current_step > 1){
    SESSION = saved;
    renderIntro();
    showResumePrompt();
    return;
  }
  renderIntro();
}

function showResumePrompt(){
  const overlay = document.getElementById("resumeOverlay");
  overlay.classList.add("open");
  document.getElementById("resumeContinueBtn").onclick = ()=>{
    overlay.classList.remove("open");
    const step = SESSION.current_step;
    if(step===1) renderStep1();
    else if(step===2) renderStep2();
    else if(step===3) renderStep3();
    else if(step===4) renderStep4();
    else if(step===5) renderStep5();
    else renderStep1();
  };
  document.getElementById("resumeRestartBtn").onclick = ()=>{
    overlay.classList.remove("open");
    clearSession();
    SESSION = null;
    renderIntro();
  };
}

boot();
</script>
